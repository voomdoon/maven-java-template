---
name: CodeQL Advanced

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '31 18 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none

          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #  v7.0.1

      - name: Detect Java sources
        id: detect
        shell: bash
        run: |
          if git ls-files -- '**/*.java' | grep -q .; then
            echo "has_java=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_java=false" >> "$GITHUB_OUTPUT"
          fi

      #  Only needed for Java/Kotlin
      - name: Set up JDK 21
        if: >
          matrix.language == 'java-kotlin' &&
          steps.detect.outputs.has_java == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  #  v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        if: >
          matrix.language != 'java-kotlin' ||
          steps.detect.outputs.has_java == 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  #  v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      #  Manual build for Java/Kotlin so CodeQL can extract + compile with Java 21
      - name: Build with Maven
        if: >
          matrix.language == 'java-kotlin' &&
          steps.detect.outputs.has_java == 'true'
        run: mvn -B -DskipTests package

      - name: Perform CodeQL Analysis
        if: >
          matrix.language != 'java-kotlin' ||
          steps.detect.outputs.has_java == 'true'
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26  #  v4.39.2
        with:
          category: "/language:${{ matrix.language }}"

name: Dependabot update branches

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened]
  workflow_dispatch:

concurrency:
  group: dependabot-update-branches
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    if: >
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-slim
    steps:
      - name: Ask Dependabot to rebase out-of-date PRs
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_PAT }}
        run: |
          set -euo pipefail

          base="main"
          repo="${{ github.repository }}"

          prs="$(gh pr list \
            --repo "$repo" \
            --state open \
            --base "$base" \
            --author "dependabot[bot]" \
            --json number,headRefName,headRepositoryOwner,isCrossRepository \
            --limit 100)"

          count="$(echo "$prs" | jq 'length')"
          echo "Found $count open Dependabot PR(s) targeting $base."

          echo "$prs" | jq -c '.[]' | while read -r pr; do
            number="$(echo "$pr" | jq -r '.number')"
            branch="$(echo "$pr" | jq -r '.headRefName')"
            owner="$(echo "$pr" | jq -r '.headRepositoryOwner.login')"
            is_cross_repository="$(echo "$pr" | jq -r '.isCrossRepository')"

            if [ "$is_cross_repository" = "true" ]; then
              echo "Skipping PR #$number from $owner/$branch because it is cross-repository."
              continue
            fi

            echo "Requesting Dependabot rebase for PR #$number branch $branch."
            gh pr comment "$number" --repo "$repo" --body "@dependabot rebase"
          done
